    <button id="chat-toggle-btn" class="chat-toggle-btn" title="Abrir chat">💬</button>

        </div>
        <div class="chat-input">
            <input type="text" id="inputTexto" placeholder="Escribe un mensaje...">
            <button id="btnEnviar" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
